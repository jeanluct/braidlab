name: Build Braidlab Packages

permissions:
  contents: read

concurrency:
  # Avoid burning runner minutes on superseded commits for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "release-*"
  pull_request:
  workflow_dispatch:
    inputs:
      matlab_release:
        description: MATLAB release for the release-pinned lane
        required: true
        # Keep in sync with the inline default in BRAIDLAB_RELEASE_MATLAB below.
        default: R2024b
        type: string

env:
  # Centralized workflow defaults.  Repository variables can override selected
  # values without editing this file.
  #
  # GitHub does not allow self-references inside an env: block, so the
  # default values are inlined directly in each fallback expression
  # rather than defined as separate _DEFAULT entries.

  # Release lanes use a pinned MATLAB version for reproducible archives.
  # Resolution order:
  # 1) workflow_dispatch input, 2) repository variable, 3) inline default.
  BRAIDLAB_RELEASE_MATLAB: ${{ github.event.inputs.matlab_release || vars.BRAIDLAB_RELEASE_MATLAB || 'R2024b' }}
  # Compat lane toolchain pin.  Can be moved forward via repo variable.
  BRAIDLAB_COMPAT_GCC_MAJOR: ${{ vars.BRAIDLAB_COMPAT_GCC_MAJOR || '12' }}
  # Docs toolchain packages.
  BRAIDLAB_LATEX_PACKAGES: ${{ vars.BRAIDLAB_LATEX_PACKAGES || 'texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra make' }}
  # Build parallelism for CMake builds.
  BRAIDLAB_BUILD_PARALLEL: ${{ vars.BRAIDLAB_BUILD_PARALLEL || '4' }}
  # Toolchain pins for the release lanes.  These follow the compilers
  # MathWorks supports for BRAIDLAB_RELEASE_MATLAB (R2024b: Xcode 15-16,
  # MSVC 2017-2022, GCC 8-13) and must be bumped together with it; see
  # devel/RELEASE-CONFIG.md.  The runner images themselves are pinned in
  # the release_pinned matrix below.  (Windows uses windows-2022: since
  # September 2026 the windows-2025 label serves an image with only
  # Visual Studio 2026, which R2024b does not support.)
  BRAIDLAB_XCODE_VERSION: ${{ vars.BRAIDLAB_XCODE_VERSION || '16.4' }}
  BRAIDLAB_VS_GENERATOR: ${{ vars.BRAIDLAB_VS_GENERATOR || 'Visual Studio 17 2022' }}
  BRAIDLAB_CMAKE_VERSION: ${{ vars.BRAIDLAB_CMAKE_VERSION || '3.31.6' }}
  # Oldest macOS the packages support (R2024b: 13.7 and newer).
  BRAIDLAB_MACOS_DEPLOYMENT_TARGET: ${{ vars.BRAIDLAB_MACOS_DEPLOYMENT_TARGET || '13.0' }}
  # GMP linked statically into the release packages
  # (.github/scripts/build-gmp-static.sh).  The checksum is of
  # gmp-<version>.tar.xz and must be updated with the version.
  BRAIDLAB_GMP_VERSION: '6.3.0'
  # Linux packages are built in this manylinux image (AlmaLinux 8, glibc
  # 2.28, the oldest glibc R2024b supports), pinned to a dated tag, with
  # a gcc-toolset in R2024b's supported GCC range.
  BRAIDLAB_MANYLINUX_IMAGE: 'quay.io/pypa/manylinux_2_28_x86_64:2026.09.23-1'
  BRAIDLAB_GCC_TOOLSET: '13'
  BRAIDLAB_GMP_SHA256: 'a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898'

jobs:
  docs_pdf:
    # Build docs once and reuse in all platform package jobs.
    name: Build Braidlab Guide PDF
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ${BRAIDLAB_LATEX_PACKAGES}

      - name: Build guide PDF
        run: make -C doc braidlab_guide.pdf

      - name: Upload guide PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-pdf
          path: doc/braidlab_guide.pdf
          if-no-files-found: error

  release_pinned:
    name: Build Package (${{ matrix.os }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    needs: docs_pdf
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default flavor: GMP linked statically into the MEX files.
          # The Linux token records the glibc baseline the package needs
          # (it is built in a manylinux_2_28 container on this host).
          - os: ubuntu-22.04
            platform_token: linux-glibc2.28
            archive_ext: tar.gz
            flavor: default
            gmp_linkage: static
          - os: macos-15
            platform_token: macos
            archive_ext: zip
            flavor: default
            gmp_linkage: static
          - os: macos-15-intel
            platform_token: macos
            archive_ext: zip
            flavor: default
            gmp_linkage: static
          - os: windows-2022
            platform_token: windows
            archive_ext: zip
            flavor: default
            gmp_linkage: static
          # no-gmp flavor: built on every push to catch GMP-free
          # build regressions early.  Cheap because no GMP is built.
          - os: ubuntu-22.04
            platform_token: linux-glibc2.28
            archive_ext: tar.gz
            flavor: no-gmp
            gmp_linkage: 'off'
          - os: macos-15
            platform_token: macos
            archive_ext: zip
            flavor: no-gmp
            gmp_linkage: 'off'
          - os: macos-15-intel
            platform_token: macos
            archive_ext: zip
            flavor: no-gmp
            gmp_linkage: 'off'
          - os: windows-2022
            platform_token: windows
            archive_ext: zip
            flavor: no-gmp
            gmp_linkage: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MATLAB (release-pinned)
        id: setup-matlab
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.BRAIDLAB_RELEASE_MATLAB }}

      - name: Setup CMake (pinned)
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ env.BRAIDLAB_CMAKE_VERSION }}

      - name: Select Xcode (macOS, pinned)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          # Use an explicit Xcode rather than the image default, which
          # changes over time.  DEVELOPER_DIR applies to later steps.
          XCODE_APP="/Applications/Xcode_${BRAIDLAB_XCODE_VERSION}.app"
          test -d "${XCODE_APP}" || {
            echo "Pinned Xcode ${BRAIDLAB_XCODE_VERSION} not on this image:"
            ls -d /Applications/Xcode*.app
            exit 1
          }
          echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version | head -1
          if [ "${{ runner.os }}" = "macOS" ]; then
            xcodebuild -version
            clang --version | head -1
            sw_vers
          fi

      - name: Cache static GMP (Linux)
        id: gmp-cache-linux
        if: ${{ runner.os == 'Linux' && matrix.gmp_linkage == 'static' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gmp-static
          key: gmp-${{ env.BRAIDLAB_GMP_VERSION }}-${{ env.BRAIDLAB_MANYLINUX_IMAGE }}-gcc${{ env.BRAIDLAB_GCC_TOOLSET }}-${{ hashFiles('.github/scripts/build-gmp-static.sh') }}

      - name: Build and stage in manylinux container (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          MATLAB_ROOT: ${{ steps.setup-matlab.outputs.matlabroot }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gmp-static"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" \
            -v "${MATLAB_ROOT}:${MATLAB_ROOT}:ro" \
            -v "${RUNNER_TEMP}/gmp-static:/opt/gmp-static" \
            -e MATLAB_ROOT \
            -e BRAIDLAB_GMP_LINKAGE=${{ matrix.gmp_linkage }} \
            -e CMAKE_VERSION="${BRAIDLAB_CMAKE_VERSION}" \
            -e GCC_TOOLSET="${BRAIDLAB_GCC_TOOLSET}" \
            -e GMP_PREFIX=/opt/gmp-static \
            -e GMP_VERSION="${BRAIDLAB_GMP_VERSION}" \
            -e GMP_SHA256="${BRAIDLAB_GMP_SHA256}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e BUILD_PARALLEL="${BRAIDLAB_BUILD_PARALLEL}" \
            "${BRAIDLAB_MANYLINUX_IMAGE}" \
            .github/scripts/build-linux-manylinux.sh

      - name: Cache static GMP (macOS)
        id: gmp-cache
        if: ${{ runner.os == 'macOS' && matrix.gmp_linkage == 'static' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gmp-static
          key: gmp-${{ env.BRAIDLAB_GMP_VERSION }}-${{ matrix.os }}-${{ runner.arch }}-macos${{ env.BRAIDLAB_MACOS_DEPLOYMENT_TARGET }}-xcode${{ env.BRAIDLAB_XCODE_VERSION }}-${{ hashFiles('.github/scripts/build-gmp-static.sh') }}

      - name: Build static GMP (macOS)
        if: ${{ runner.os == 'macOS' && matrix.gmp_linkage == 'static' && steps.gmp-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          GMP_VERSION: ${{ env.BRAIDLAB_GMP_VERSION }}
          GMP_SHA256: ${{ env.BRAIDLAB_GMP_SHA256 }}
          MACOSX_DEPLOYMENT_TARGET: ${{ env.BRAIDLAB_MACOS_DEPLOYMENT_TARGET }}
        run: .github/scripts/build-gmp-static.sh "${RUNNER_TEMP}/gmp-static"

      - name: Install static GMP (Windows)
        if: ${{ runner.os == 'Windows' && matrix.gmp_linkage == 'static' }}
        shell: bash
        run: |
          # Static GMP built against the release DLL C runtime (/MD), which
          # is what MATLAB and our MEX files use.  vcpkg ships preinstalled
          # on the Windows runners.
          vcpkg install gmp:x64-windows-static-md
          # Expose vcpkg toolchain location for the configure step.
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"

      - name: Configure CMake
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        run: |
          CMAKE_ARGS=(-S . -B build "-DBRAIDLAB_GMP_LINKAGE=${{ matrix.gmp_linkage }}")
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Pin the Visual Studio version rather than taking the newest
            # one installed on the image.  CMAKE_BUILD_TYPE matters even
            # with this multi-config generator: without it, vcpkg's
            # toolchain prefers its debug libraries.
            CMAKE_ARGS+=(-G "${BRAIDLAB_VS_GENERATOR}" -A x64 -DCMAKE_BUILD_TYPE=Release)
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            CMAKE_ARGS+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=${BRAIDLAB_MACOS_DEPLOYMENT_TARGET}")
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.gmp_linkage }}" = "static" ]; then
            CMAKE_ARGS+=("-DCMAKE_PREFIX_PATH=${RUNNER_TEMP}/gmp-static")
          fi
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.gmp_linkage }}" = "static" ]; then
            CMAKE_ARGS+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
            CMAKE_ARGS+=("-DVCPKG_TARGET_TRIPLET=x64-windows-static-md")
          fi
          cmake "${CMAKE_ARGS[@]}"

      - name: Build CMake targets
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        run: cmake --build build --config Release -j "${BRAIDLAB_BUILD_PARALLEL}"

      - name: Install staged package
        if: ${{ runner.os != 'Linux' }}
        shell: bash
        # Assemble the final package layout in an isolated staging folder.
        run: cmake --install build --prefix stage --config Release

      - name: Verify VPI bundled in stage
        shell: bash
        run: |
          test -f stage/extern/VariablePrecisionIntegers/@vpi/vpi.m \
            || { echo "VPI not staged"; ls -R stage/extern || true; exit 1; }

      - name: Verify examples bundled in stage
        shell: bash
        run: |
          test -f stage/examples/taffy.m || { echo "taffy.m not staged"; ls stage/examples || true; exit 1; }
          test -f stage/examples/arrow.m || { echo "arrow.m not staged"; ls stage/examples || true; exit 1; }

      - name: Download guide PDF
        uses: actions/download-artifact@v8
        with:
          name: docs-pdf
          path: stage/doc

      - name: Verify MATLAB library references (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          # Regression check: every MEX must record libmex.so and
          # libmx.so as bare basenames in DT_NEEDED, never as absolute
          # paths.  An absolute path such as
          #   /opt/hostedtoolcache/MATLAB/.../libmex.so
          # is portable only on the build machine; users on different
          # MATLAB installs see "Invalid MEX-file: ... cannot open
          # shared object file: No such file or directory".
          PRIV="stage/+braidlab/@braid/private"
          fail=0
          for mex_file in "${PRIV}"/*.mexa64; do
            echo "--- ${mex_file} ---"
            readelf -d "${mex_file}" | grep '(NEEDED)' || true
            for lib in libmex.so libmx.so; do
              if readelf -d "${mex_file}" | grep -E "\(NEEDED\).*\[/.*${lib}\]" >/dev/null; then
                echo "FAIL: ${mex_file} records absolute path to ${lib}"
                fail=1
              fi
            done
          done
          test "${fail}" -eq 0 || exit 1

      - name: Verify static GMP (Linux)
        if: ${{ runner.os == 'Linux' && matrix.gmp_linkage == 'static' }}
        shell: bash
        run: |
          # With static GMP, no MEX may depend on libgmp, and no shared
          # libraries may be shipped.
          fail=0
          if find stage -name '*.so*' | grep .; then
            echo "FAIL: shared libraries shipped in the package"; fail=1
          fi
          for mex_file in $(find stage -name '*.mexa64'); do
            if readelf -d "${mex_file}" | grep -E '\(NEEDED\).*gmp'; then
              echo "FAIL: ${mex_file} depends on libgmp"; fail=1
            fi
          done
          test -f stage/extern/gmp/README.md || { echo "FAIL: GMP README not staged"; fail=1; }
          test "${fail}" -eq 0

      - name: Verify static GMP (macOS)
        if: ${{ runner.os == 'macOS' && matrix.gmp_linkage == 'static' }}
        shell: bash
        run: |
          # With static GMP, no MEX may load a GMP dylib, and none may be
          # shipped.
          fail=0
          if find stage -name '*.dylib' | grep .; then
            echo "FAIL: dynamic libraries shipped in the package"; fail=1
          fi
          for mex_file in $(find stage -name '*.mexmac*'); do
            if otool -L "${mex_file}" | grep -i gmp; then
              echo "FAIL: ${mex_file} depends on a GMP dylib"; fail=1
            fi
          done
          test -f stage/extern/gmp/README.md || { echo "FAIL: GMP README not staged"; fail=1; }
          test "${fail}" -eq 0

      - name: Verify static GMP and release runtime (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          # No MEX may import a GMP DLL (GMP is static) or Microsoft's
          # debug C runtime (present only where Visual Studio is
          # installed), and no DLLs may be shipped.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $fail = $false
          $dlls = Get-ChildItem -Path stage -Recurse -Filter *.dll
          if ($dlls) { Write-Host "FAIL: DLLs shipped: $($dlls.Name)"; $fail = $true }
          foreach ($mex in Get-ChildItem -Path stage -Recurse -Filter *.mexw64) {
            $imports = & $dumpbin.FullName /dependents $mex.FullName |
              Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            Write-Host "$($mex.Name): $($imports -join ' ')"
            foreach ($imp in $imports) {
              if ($imp -match '^(lib)?gmp') {
                Write-Host "FAIL: $($mex.Name) imports $imp"; $fail = $true
              }
              if ($imp -match '^(msvcp|vcruntime)\d+d(_\d+)?\.dll$' -or $imp -match '^ucrtbased\.dll$') {
                Write-Host "FAIL: $($mex.Name) imports debug runtime $imp"; $fail = $true
              }
            }
          }
          if ('${{ matrix.gmp_linkage }}' -eq 'static' -and -not (Test-Path stage/extern/gmp/README.md)) {
            Write-Host "FAIL: GMP README not staged"; $fail = $true
          }
          if ($fail) { exit 1 }

      - name: MATLAB smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            % Keep CI lightweight here: sanity-check package load and key MEX calls.
            root = getenv('MW_ORIG_WORKING_FOLDER');
            stageRoot = fullfile(root,'stage');
            if ismac
              engineLibDir = fullfile(matlabroot,'extern','bin',computer('arch'));
              if isfolder(engineLibDir)
                prev = getenv('DYLD_LIBRARY_PATH');
                if isempty(prev)
                  setenv('DYLD_LIBRARY_PATH',engineLibDir);
                else
                  setenv('DYLD_LIBRARY_PATH',[engineLibDir pathsep prev]);
                end
              end
            end
            cd(stageRoot);
            addpath(stageRoot,'-begin');
            import braidlab.*;
            b = braid([1 2 -3]);
            c = b.compact;
            t = b.train;
            assert(~isempty(c));
            assert(isfield(t,'tntype'));
            disp(t.tntype);
            % Confirm the bundled Variable Precision Integers library is
            % discoverable via the documented helper.
            braidlab.util.checkvpi();
            assert(exist('vpi','file') > 0, 'vpi class not on path after checkvpi');
            % Exercise a GMP-using code path when GMP is enabled.
            % entropy() uses the GMP-backed loopsigma_helper on long words.
            gmpFlavor = '${{ matrix.gmp_linkage }}';
            if ~strcmp(gmpFlavor, 'off')
              bLong = braid([1 2 -3 1 -2 3 1 2 -3]);
              e = bLong.entropy;
              assert(isfinite(e) && e > 0, 'entropy must be a finite positive number');
              fprintf('entropy = %g (gmp_linkage=%s)\n', e, gmpFlavor);
            else
              fprintf('Skipping GMP-dependent entropy check (gmp_linkage=off)\n');
            end

      - name: Build package archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/release-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/release-}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          case "${RUNNER_ARCH}" in
            X64) ARCH_TOKEN="x86_64" ;;
            ARM64) ARCH_TOKEN="arm64" ;;
            *) ARCH_TOKEN="$(printf '%s' "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')" ;;
          esac

          MATLAB_TOKEN="matlab-${BRAIDLAB_RELEASE_MATLAB}"
          # Archive naming standard:
          # braidlab-<version>_<platform>-<arch>_matlab-<release>[_no-gmp]
          BASE_NAME="braidlab-${VERSION}_${{ matrix.platform_token }}-${ARCH_TOKEN}_${MATLAB_TOKEN}"
          if [ "${{ matrix.flavor }}" = "no-gmp" ]; then
            BASE_NAME="${BASE_NAME}_no-gmp"
          fi

          # Include distribution metadata and tests in package output.
          cp README.md LICENSE COPYING CHANGELOG.md stage/
          cp -a testsuite stage/
          PACKAGE_PATHS="+braidlab extern examples doc testsuite BUILD-MANIFEST.txt README.md LICENSE COPYING CHANGELOG.md"

          {
            echo "commit=${GITHUB_SHA}"
            echo "matlab_release=${BRAIDLAB_RELEASE_MATLAB}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "platform_token=${{ matrix.platform_token }}"
            echo "flavor=${{ matrix.flavor }}"
            echo "gmp_linkage=${{ matrix.gmp_linkage }}"
            if [ "${{ matrix.gmp_linkage }}" = "static" ]; then
              echo "gmp_version=${BRAIDLAB_GMP_VERSION}"
            fi
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > stage/BUILD-MANIFEST.txt

          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            ARCHIVE_NAME="${BASE_NAME}.tar.gz"
            tar -C stage -czf "${ARCHIVE_NAME}" ${PACKAGE_PATHS}
          else
            ARCHIVE_NAME="${BASE_NAME}.zip"
            cmake -E chdir stage cmake -E tar cfv "../${ARCHIVE_NAME}" --format=zip ${PACKAGE_PATHS}
          fi

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  compat_latest:
    name: Compatibility Check (ubuntu)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/release-') }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MATLAB (latest available)
        uses: matlab-actions/setup-matlab@v3

      - name: Install GCC toolchain
        shell: bash
        run: |
          # Keep compat lane ABI aligned with MATLAB runtime libraries.
          sudo apt-get update
          sudo apt-get install -y gcc-${BRAIDLAB_COMPAT_GCC_MAJOR} g++-${BRAIDLAB_COMPAT_GCC_MAJOR}

      - name: Configure CMake
        shell: bash
        # Force pinned GCC major to avoid GLIBCXX mismatches on latest MATLAB lane.
        run: cmake -S . -B build-compat -DBRAIDLAB_USE_GMP=ON -DCMAKE_C_COMPILER=gcc-${BRAIDLAB_COMPAT_GCC_MAJOR} -DCMAKE_CXX_COMPILER=g++-${BRAIDLAB_COMPAT_GCC_MAJOR}

      - name: Build CMake targets
        shell: bash
        run: cmake --build build-compat --config Release -j "${BRAIDLAB_BUILD_PARALLEL}"

      - name: MATLAB smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            root = getenv('MW_ORIG_WORKING_FOLDER');
            buildRoot = fullfile(root,'build-compat');
            stageCompat = fullfile(root,'stage-compat');
            if ~isfolder(stageCompat)
              mkdir(stageCompat);
            end
            [status, cmdout] = system(sprintf('cmake --install "%s" --prefix "%s" --config Release', buildRoot, stageCompat));
            assert(status == 0, cmdout);
            if isunix && ~ismac
              % Prefer runner libstdc++ over MATLAB-bundled one for newest GCC ABI.
              setenv('LD_PRELOAD','/usr/lib/x86_64-linux-gnu/libstdc++.so.6');
            end
            cd(buildRoot);
            addpath(stageCompat,'-begin');
            import braidlab.*;
            b = braid([1 2 -3]);
            c = b.compact;
            assert(~isempty(c));
